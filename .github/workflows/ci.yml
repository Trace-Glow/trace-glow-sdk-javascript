name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: mkdir -p "${RUNNER_TEMP}/trace-glow-packs"
      - run: pnpm --filter '@trace-glow-sdk/*' pack --pack-destination "${RUNNER_TEMP}/trace-glow-packs"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/trace-glow-packs/*.tgz
